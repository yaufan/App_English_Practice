name: Android APK

# Builds an installable APK on every push to main (or by hand), publishes it as a GitHub Release,
# and prints a QR code that always points to the newest APK.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Checked before the long build so a signing problem fails in seconds, not after 12 minutes.
      # Accepts a few common secret names; the key alias is read from the keystore when not given.
      - name: Resolve signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_SIGNING_KEY || secrets.SIGNING_KEY }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ANDROID_KEYSTORE_ALIAS || secrets.ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          OUT="$RUNNER_TEMP/signing.env"
          : > "$OUT"
          if [ -z "$KS_B64" ]; then
            echo "No keystore secret: the APK will be signed with the project's fixed debug key."
            exit 0
          fi
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > "$KS" || { echo "::error::Keystore secret is not valid base64."; exit 1; }
          if [ -z "$KS_PASS" ]; then
            echo "::error::Found a keystore secret but no keystore password secret (e.g. ANDROID_KEYSTORE_PASSWORD)."
            exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$KS_PASS" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::Cannot open the keystore with the given password."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=$(keytool -list -v -keystore "$KS" -storepass "$KS_PASS" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)
            echo "No alias secret; using the alias found in the keystore: $KEY_ALIAS"
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::No key alias found in the keystore."
            exit 1
          fi
          [ -n "$KEY_PASS" ] || KEY_PASS="$KS_PASS"
          # %q keeps passwords with spaces or symbols safe when the file is sourced later
          printf 'SIGN_STORE_FILE=%q\nSIGN_STORE_PASSWORD=%q\nSIGN_KEY_ALIAS=%q\nSIGN_KEY_PASSWORD=%q\n' \
            "$KS" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > "$OUT"
          echo "Release signing: keystore from repository secrets, alias '$KEY_ALIAS'."

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          cd android
          SIGN=()
          set -a; . "$RUNNER_TEMP/signing.env"; set +a
          if [ -n "${SIGN_STORE_FILE:-}" ]; then
            SIGN=(
              "-Pandroid.injected.signing.store.file=$SIGN_STORE_FILE"
              "-Pandroid.injected.signing.store.password=$SIGN_STORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$SIGN_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$SIGN_KEY_PASSWORD"
            )
          fi
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a "${SIGN[@]}"

      - name: Prepare release files
        id: files
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build${VERSION_CODE}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/english-practice.apk"
          cp out/english-practice.apk "out/english-practice-${TAG}.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/english-practice.apk"
          pip install --quiet "qrcode[pil]"
          python3 -c "import qrcode,sys; qrcode.make(sys.argv[1], box_size=10, border=2).save('out/install-qr.png')" "$URL"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.files.outputs.tag }}
          name: 英文練習 ${{ steps.files.outputs.tag }}
          make_latest: true
          body: |
            用手機掃 QR code（或開下面的連結）下載 APK 安裝。

            最新版固定網址：${{ steps.files.outputs.url }}

            ![安裝 QR code](https://github.com/${{ github.repository }}/releases/download/${{ steps.files.outputs.tag }}/install-qr.png)

            Commit：${{ github.sha }}
          files: |
            out/english-practice.apk
            out/english-practice-${{ steps.files.outputs.tag }}.apk
            out/install-qr.png

      - name: Summary
        run: |
          {
            echo "## 英文練習 ${{ steps.files.outputs.tag }}"
            echo ""
            echo "下載（永遠是最新版）：${{ steps.files.outputs.url }}"
            echo ""
            echo "Release：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.files.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
