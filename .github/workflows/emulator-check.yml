name: Emulator check

# Test-only workflow: runs on the ci/emulator-test branch, never touches main or Releases.
# Builds an x86_64 APK, walks every screen on an Android emulator with Maestro,
# checks the on-device model's replies with llama.cpp, and commits the results back to the branch.
on:
  push:
    branches: ['ci/emulator-test', 'feat/offline-model']
    paths-ignore: ['ci-results/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator-check
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: 1

jobs:
  prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qwen3.5-2b
            url: https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf
          - name: qwen3.5-4b
            url: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download model (same file the app downloads)
        run: |
          curl -sSIL "${{ matrix.url }}" | grep -iE "^HTTP|content-length" | tail -3
          curl -fL --retry 3 -o model.gguf "${{ matrix.url }}"
          ls -la model.gguf
      # Build the same llama.cpp commit that llama.rn ships, so the CI check matches the phone.
      - name: Build llama.cpp server (same version as the app)
        run: |
          LLAMA_COMMIT=$(sed -n "s/.*BUILD_COMMIT = '\([0-9a-f]*\)'.*/\1/p" node_modules/llama.rn/src/version.ts)
          echo "llama.cpp commit: $LLAMA_COMMIT"
          mkdir -p llama && cd llama
          git init -q && git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch -q --depth 1 origin "$LLAMA_COMMIT" && git checkout -q FETCH_HEAD || { git fetch -q --depth 1 origin master && git checkout -q FETCH_HEAD; }
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF > /dev/null
          cmake --build build -j4 --target llama-server > /dev/null
          ls -la build/bin/llama-server

      - name: Check replies with the app's prompts
        run: |
          SERVER="$PWD/llama/build/bin/llama-server"
          export LD_LIBRARY_PATH="$(dirname "$SERVER"):${LD_LIBRARY_PATH:-}"
          "$SERVER" -m model.gguf --jinja -c 4096 --port 8080 > server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health > /dev/null && break; sleep 2; done
          tail -5 server.log
          mkdir -p ci-results
          LLM_URL=http://127.0.0.1:8080 MODEL_NAME=${{ matrix.name }} node --experimental-strip-types --no-warnings ci/prompt-eval.ts | tee "ci-results/prompt-eval-${{ matrix.name }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-results-${{ matrix.name }}
          path: ci-results/prompt-eval-*.md

  emulator:
    # put [eval-only] in the commit message to skip the emulator and only check model replies
    if: ${{ !contains(github.event.head_commit.message, '[eval-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - run: npx expo prebuild --platform android --clean --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build x86_64 APK for the emulator
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: ci-results/

  publish:
    needs: [prompts, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Commit results to the test branch
        run: |
          rm -rf ci-results && mkdir -p ci-results
          cp -r artifacts/emulator-results/. ci-results/ 2>/dev/null || true
          for d in artifacts/prompt-results-*; do cp -r "$d"/. ci-results/ 2>/dev/null || true; done
          echo "run: ${{ github.run_id }}  prompts=${{ needs.prompts.result }}  emulator=${{ needs.emulator.result }}" > ci-results/RUN.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results
          git commit -m "ci: emulator check results (${{ github.run_id }})" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
