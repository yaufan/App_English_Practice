appId: com.yaufan.englishpractice
---
# Runs only when an API key secret exists. Never screenshot the settings page after the key is saved.
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "今日對話"
    timeout: 60000
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "key-input"
- inputText: ${API_KEY}
- hideKeyboard
- tapOn: "儲存並測試"
- extendedWaitUntil:
    visible: "金鑰可以用.*"
    timeout: 45000
- tapOn:
    id: "tab-talk"
- tapOn: "咖啡店點餐"
- tapOn: "開始對話"
- assertVisible: "Hi there! What can I get for you today?"
- tapOn:
    id: "chat-input"
- inputText: "i want latte big"
- hideKeyboard
- tapOn:
    id: "send-btn"
- extendedWaitUntil:
    visible: "更自然的說法"
    timeout: 60000
- takeScreenshot: 06a_ai_turn1
- tapOn:
    id: "chat-input"
- inputText: "ice please and to go"
- hideKeyboard
- tapOn:
    id: "send-btn"
- extendedWaitUntil:
    notVisible: "對方正在回覆…"
    timeout: 60000
- takeScreenshot: 06b_ai_turn2
- tapOn:
    id: "hint-btn"
- takeScreenshot: 06c_ai_hint
- tapOn:
    id: "hint-btn"
- tapOn:
    id: "finish-btn"
- extendedWaitUntil:
    visible: "整體回饋"
    timeout: 90000
- takeScreenshot: 06d_ai_summary
- back
- tapOn:
    id: "tab-listen"
- tapOn: "請 AI 產生新短文"
- tapOn: "AI 工作"
- tapOn: "介紹語音辨識系統"
- tapOn: "產生短文"
- extendedWaitUntil:
    visible: "播放全文"
    timeout: 120000
- tapOn: "顯示英文"
- tapOn: "顯示中文"
- takeScreenshot: 06e_ai_passage
